<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IC Weekly Portal{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}">
</head>
<body>
    <header class="site-header" id="site-header">
        <div class="wrap">
            <div class="brand">
                <img class="brand-logo" src="{{ url_for('static', filename='images/six-peak-logo.webp') }}" alt="Six Peak Capital" />
                <div class="brand-text">
                    <span class="brand-title">IC Weekly Portal</span>
                    <span class="brand-date">{{ today_display }}</span>
                </div>
            </div>
            <nav class="top-nav">
                <a href="{{ url_for('portal') }}">Dashboard</a>
                <a href="{{ url_for('portal') }}#todos">To-Dos</a>
                <a href="{{ url_for('portal') }}#goals">Goals</a>
                <a href="{{ url_for('portal') }}#history">History</a>
            </nav>
        </div>
    </header>
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="wrap">
            <span>Six Peak IC Weekly — auto-updated after each meeting</span>
            <span>Six Peak Capital</span>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='portal.js') }}"></script>
    <script>
      (function () {
        var header = document.getElementById('site-header');
        if (header) {
          var onScroll = function () { header.classList.toggle('scrolled', window.scrollY > 40); };
          window.addEventListener('scroll', onScroll, { passive: true });
          onScroll();
        }
        var reveals = document.querySelectorAll('.reveal');
        if ('IntersectionObserver' in window && reveals.length) {
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
          }, { threshold: 0.12 });
          reveals.forEach(function (el, i) { el.style.transitionDelay = (Math.min(i, 6) * 60) + 'ms'; io.observe(el); });
        } else {
          reveals.forEach(function (el) { el.classList.add('in'); });
        }
      })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
